:root{
  --papier:#F4EFE6;--kraft:#E8E0D2;--blanc:#FFFFFF;--marine:#022B61;--marine-survol:#0C3B7A;--encre:#0E1A2B;
  --ardoise:#5A5F6B;--filet:#D9D3C7;--brique:#B5381C;--brique-survol:#962E17;--vestiaire:#1E4634;
  --serif:'Fraunces',Georgia,serif;--sans:'Instrument Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:'Archivo',var(--sans);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papier);color:var(--encre);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--marine)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marine);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1440px;margin:0 auto;padding:0 96px}
@media(max-width:900px){.wrap{padding:0 20px}}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--marine);margin:0;letter-spacing:-.01em}
.display{font-size:72px;line-height:1.05}.h1{font-size:56px;line-height:1.08}.h2{font-size:40px;line-height:1.15}.h3{font-size:28px;line-height:1.2}
@media(max-width:900px){.display{font-size:44px}.h1{font-size:36px}.h2{font-size:30px}.h3{font-size:24px}}
.chapo{font-family:var(--serif);font-style:italic;font-weight:300;font-size:24px;line-height:1.4}
@media(max-width:900px){.chapo{font-size:20px}}
.lab{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.leg{font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--ardoise)}
.s{font-size:14px}.muted{color:var(--ardoise)}.accent{color:var(--brique)}.marine{color:var(--marine)}
.stat{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.1;color:var(--marine)}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:2px;border:1.5px solid transparent;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn-p{background:var(--marine);color:#fff}.btn-p:hover{background:var(--marine-survol)}
.btn-s{background:transparent;border-color:var(--marine);color:var(--marine)}.btn-s:hover{background:var(--kraft)}
.btn-a{background:var(--brique);color:#fff}.btn-a:hover{background:var(--brique-survol)}
.btn-l{background:none;border:none;padding:8px 0;color:var(--brique);text-decoration:underline}
.btn-l:hover{color:var(--marine)}
.btn-sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-block{width:100%}
.more{display:inline-flex;align-items:center;gap:10px;font-weight:600;color:var(--marine);background:none;border:0;cursor:pointer;padding:8px 0;text-decoration:none}
/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;white-space:nowrap;text-decoration:none;color:inherit;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--ardoise);background:transparent;cursor:pointer;font-size:16px;line-height:1.2}
.chip:hover{background:var(--kraft)}
.chip.on{background:var(--marine);border-color:var(--marine);color:#fff}
.scroll-x{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:2px}.scroll-x::-webkit-scrollbar{display:none}
/* badges */
.badge{display:inline-block;padding:4px 8px;border-radius:2px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.b-libre{background:var(--brique);color:#fff}.b-contrat{background:var(--kraft);color:var(--marine)}.b-fin{border:1px solid var(--marine);color:var(--marine)}
.b-recrute{background:var(--vestiaire);color:#fff}.b-arrete{border:1px solid var(--ardoise);color:var(--ardoise)}
/* accès */
.acc{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;background:none}
.acc-visible{background:var(--vestiaire);color:#fff}.acc-floute{background:var(--kraft);color:var(--marine)}.acc-masque{border:1px dashed var(--ardoise);color:var(--ardoise)}
/* champs */
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ardoise)}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border:1px solid var(--ardoise);border-radius:2px;background:#fff;font-size:16px}
.input:focus{outline:2px solid var(--marine);outline-offset:0;border-color:var(--marine)}
.input.err{border:2px solid var(--brique)}
.errmsg{color:var(--brique);font-size:14px}
textarea.input{min-height:120px;resize:vertical}
/* header */
.demo{background:var(--marine);color:#fff;font-size:12px;letter-spacing:.04em}
.demo .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;padding-top:6px;padding-bottom:6px;flex-wrap:wrap}
.demo button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:2px;padding:2px 8px;cursor:pointer;font-size:12px}

// ---------- Utilitaires ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=1)=>v==null||v===''?'':(S.lang==='fr'?Number(v).toFixed(d).replace('.',','):Number(v).toFixed(d));
const age=b=>{if(!b)return null;const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a;};
const ftIn=cm=>{const i=Math.round(cm/2.54);return `${Math.floor(i/12)}'${i%12}"`};
const lbs=kg=>Math.round(kg*2.20462)+' lbs';
const mStr=cm=>S.lang==='fr'?(cm/100).toFixed(2).replace('.',',')+' m':(cm/100).toFixed(2)+' m';
function heightMain(cm){return S.lang==='fr'?[mStr(cm),ftIn(cm)]:[ftIn(cm),mStr(cm)]}
function weightMain(kg){return S.lang==='fr'?[kg+' kg',lbs(kg)]:[lbs(kg),kg+' kg']}
const fmtDate=d=>{if(!d)return'—';const x=new Date(d);return x.toLocaleDateString(S.lang==='fr'?'fr-FR':'en-GB')};
const fmtDT=d=>{const x=new Date(d);return x.toLocaleDateString(S.lang==='fr'?'fr-FR':'en-GB')+' · '+x.toLocaleTimeString(S.lang==='fr'?'fr-FR':'en-GB',{hour:'2-digit',minute:'2-digit'})};

const visitor=()=>S.session&&S.session.role==='visitor'?S.visitors.find(v=>v.id===S.session.id):null;
const isAdmin=()=>S.session&&S.session.role==='admin';
function access(p){
  if(isAdmin()&&previewAs==='full')return'visible';
  if(isAdmin()&&previewAs==='public')return p.archived!=='actif'&&!p.showAsReference?'masque':(p.publicAccess||'masque');
  if(p.archived!=='actif'&&!p.showAsReference)return'masque';
  const v=visitor();
  if(v){if(v.expires&&new Date(v.expires)<new Date())return'masque';return v.access[p.id]||'masque';}
  return p.publicAccess||'masque';
}
// Version anonymisée : ce que le serveur enverrait pour un profil flouté
function anon(p){return{id:p.id,ref:p.ref,positions:p.positions,age:age(p.birth),height:p.height,weight:p.weight,wingspan:p.wingspan,hand:p.hand,status:p.status,contractEnd:p.contractEnd,stats:p.stats,photoBlur:p.photoBlur,archived:p.archived,blurred:true}}
const visiblePlayers=()=>S.players.map(p=>({p,a:access(p)})).filter(x=>x.a!=='masque');
function statusBadge(p){if(p.archived==='recrute')return`<span class="badge b-recrute">${p.recruitedBy?esc(t('reference')(p.recruitedBy)):t('recrute')}</span>`;
  if(p.archived==='arrete')return`<span class="badge b-arrete">${t('arrete')}</span>`;
  if(p.status==='libre')return`<span class="badge b-libre">${t('libre')}</span>`;
  if(p.status==='fin')return`<span class="badge b-fin">${t('fin')}${p.contractEnd?' '+esc(p.contractEnd.split('-').reverse().join('/')):''}</span>`;
  return`<span class="badge b-contrat">${t('contrat')}</span>`;}
function logView(p){S.views.push({pid:p.id,vid:visitor()?visitor().id:null,at:new Date().toISOString(),a:access(p)});save();}

function card(p,a){
  const blurred=a==='floute';const d=blurred?anon(p):p;const st=curStats(d);const ag=age(p.birth);
  const photo=blurred?(d.photoBlur?`<img src="${d.photoBlur}" alt="">`:`<div class="blurbg"></div>`):(p.photo?`<img src="${p.photo}" alt="${esc(p.firstName+' '+p.lastName)}">`:`<div class="placeholder"><span class="mono">LSP</span><span class="leg">${t('photoSoon')}</span></div>`);
  const title=blurred?`${posShort[S.lang][d.positions[0]-1]} · ${d.age} ${t('years')}`:esc(p.firstName+' '+p.lastName);
  const meta=blurred?`${d.height?heightMain(d.height)[0]:''}${d.weight?' · '+weightMain(d.weight)[0]:''} · ${t('idReserved')}`:[ag?ag+' '+t('years'):'',p.height?heightMain(p.height)[0]:'',p.weight?weightMain(p.weight)[0]:'',p.nationality?p.nationality.slice(0,3).toUpperCase():''].filter(Boolean).join(' · ');
  return `<article class="card"><div class="ph">${photo}${blurred?`<span class="lockchip">${ICON.lock} ${t('confidential')}</span>`:statusBadge(p)}</div>
  <div class="body"><span class="lab accent">${d.positions.map(posLabel).join(' · ')}</span><h3 class="h3">${title}</h3><span class="s muted">${meta}</span>
  ${st?`<div class="stats3">${[['pts','PTS'],['reb','REB'],['ast',S.lang==='fr'?'PD':'AST']].map(([k,l])=>st[k]!=null&&st[k]!==''?`<div><div class="stat">${num(st[k])}</div><div class="leg">${l}</div></div>`:'').join('')}</div>`:''}
  ${blurred?`<button class="btn btn-a" data-act="ask" data-id="${p.id}">${t('askInfo')}</button>`:`<a class="btn btn-s" href="#joueur-${p.id}">${t('seeProfile')}</a>`}</div></article>`;
}

let F={pos:[],ageMin:'',ageMax:'',hMin:'',hMax:'',pts:'',status:[],withStats:false,withVideo:false,q:'',sort:'height'};
function filtered(){
  let L=visiblePlayers().map(x=>({...x,d:x.a==='floute'?anon(x.p):x.p}));
  L=L.filter(({p,a,d})=>{const ag=a==='floute'?d.age:age(p.birth);const st=curStats(d);
    if(F.pos.length&&!d.positions.some(n=>F.pos.includes(n)))return false;
    if(F.ageMin&&!(ag>=+F.ageMin))return false;if(F.ageMax&&!(ag<=+F.ageMax))return false;
    if(F.hMin&&!(d.height>=+F.hMin))return false;if(F.hMax&&!(d.height<=+F.hMax))return false;
    if(F.pts&&!(st&&st.pts>=+F.pts))return false;
    if(F.status.length&&!F.status.includes(d.status))return false;
    if(F.withStats&&!(d.stats&&d.stats.length))return false;if(F.withVideo&&!(a!=='floute'&&p.video))return false;
    if(F.q){const q=F.q.toLowerCase();const hay=(a==='floute'?[d.ref,...d.positions.map(posLabel)]:[p.firstName,p.lastName,p.club,p.nationality,...p.positions.map(posLabel)]).join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;});
  const key={height:x=>x.d.height,age:x=>x.a==='floute'?x.d.age:age(x.p.birth),pts:x=>(curStats(x.d)||{}).pts,updated:x=>x.p.updated}[F.sort];
  const dir=F.sort==='age'?1:-1;
  L.sort((a,b)=>{const ka=key(a),kb=key(b);if(ka==null||ka==='')return 1;if(kb==null||kb==='')return -1;return ka>kb?dir:ka<kb?-dir:0;});
  return L;
}
function filtersHTML(){
  return `<fieldset><legend>${t('position')}</legend><div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip ${F.pos.includes(n)?'on':''}" data-fpos="${n}" aria-pressed="${F.pos.includes(n)}">${posLabel(n)}</button>`).join('')}</div></fieldset>
  <fieldset><legend>${t('age')}</legend><div class="range"><input type="number" inputmode="numeric" placeholder="min" aria-label="${t('age')} min" data-f="ageMin" value="${F.ageMin}"><span>–</span><input type="number" inputmode="numeric" placeholder="max" aria-label="${t('age')} max" data-f="ageMax" value="${F.ageMax}"></div></fieldset>

function processPhoto(file,p){const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{

  const r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  p.photo=c.toDataURL('image/webp',0.78);
  const b=document.createElement('canvas');b.width=160;b.height=205;const bx=b.getContext('2d');bx.filter='blur(14px)';bx.drawImage(c,-20,-20,200,245);
  p.photoBlur=b.toDataURL('image/webp',0.6);URL.revokeObjectURL(url);touch(p);toast('Photo ajoutée (version floutée générée) — pensez à enregistrer');
  rerender();};img.onerror=()=>toast('Image illisible');img.src=url;}
function addGallery(files,p){const room=8-p.gallery.length;if(room<=0){toast('8 photos supplémentaires au maximum');return;}
  let n=0;files.filter(f=>f.type.startsWith('image/')).slice(0,room).forEach(file=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const W=Math.min(1000,img.width),H=Math.round(img.height*W/img.width);const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(img,0,0,W,H);p.gallery.push(c.toDataURL('image/webp',0.72));URL.revokeObjectURL(url);n++;touch(p);rerender();toast(`${n} photo(s) ajoutée(s) — pensez à enregistrer`);};img.src=url;});}
function readImport(file){const fr=new FileReader();fr.onload=()=>{const txt=fr.result.replace(/^﻿/,'');const sep=txt.split('\n')[0].includes(';')?';':',';
  const parse=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'&&line[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());const head=parse(lines[0]).map(h=>h.toLowerCase());const col=n=>head.findIndex(h=>h.startsWith(n.toLowerCase()));
  const rows=lines.slice(1).map(l=>{const c=parse(l);const g=n=>{const i=col(n);return i>=0?c[i]:''};const rawH=g('Taille');const h=rawH===''?null:Number(rawH.replace(',','.'));
   const r={id:g('ID'),firstName:g('Prénom'),lastName:g('Nom'),positions:g('Poste').split(/[\/,]/).map(Number).filter(n=>n>=1&&n<=5),birth:g('Naissance'),nationality:g('Nationalité'),rawH,height:h,weight:g('Poids')?Math.round(+g('Poids').replace(',','.')):null,wingspan:g('Envergure')?Math.round(+g('Envergure')):null,hand:g('Main'),club:g('Club'),level:g('Niveau'),status:g('Statut'),contractEnd:g('Fin'),publicAccess:g('Public')};
   if(rawH&&(isNaN(h)||h<140||h>240)){r.err=`Taille « ${rawH} » : indiquez des centimètres (ex. 193)`;r.errH=true;}
   if(!r.lastName)r.err='Nom manquant';return r;});
  importPreview={name:file.name,rows};rerender();};fr.readAsText(file,'utf-8');}
// Formulaires
const attempts={};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form,fd=Object.fromEntries(new FormData(f));
  const req=[...f.querySelectorAll('[required]')];let ok=true;req.forEach(i=>{const bad=!i.value.trim()||(i.type==='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(i.value));i.classList.toggle('err',bad);i.setAttribute('aria-invalid',bad);if(bad)ok=false;});if(!ok&&k!=='login'&&k!=='admin')return;
  if(k==='login'){const n=attempts.v=(attempts.v||0);if(n>=5){$('#login-err').innerHTML=`<div class="alert" role="alert">${t('locked')}</div>`;return;}
    const v=S.visitors.find(x=>x.login===fd.login.trim()&&x.pass===fd.pass);
    if(!v){attempts.v=n+1;$('#login-err').innerHTML=`<div class="alert" role="alert">${attempts.v>=5?t('locked'):t('badLogin')(5-attempts.v)}</div>`;f.querySelectorAll('.input').forEach(i=>i.classList.add('err'));return;}
    if(v.expires&&new Date(v.expires)<new Date()){$('#login-err').innerHTML=`<div class="alert" role="alert">${t('expired')}</div>`;return;}
    attempts.v=0;v.lastVisit=new Date().toISOString();S.session={role:'visitor',id:v.id};S.lang=v.lang;save();location.hash='#joueurs';return;}
  if(k==='admin'){if(fd.login===DEMO_ADMIN.login&&fd.pass===DEMO_ADMIN.pass){S.session={role:'admin'};save();if(location.hash==='#admin'||!location.hash.startsWith('#admin-'))location.hash='#admin-joueurs';route();}else{$('#login-err').innerHTML='<div class="alert" role="alert">Identifiant ou mot de passe incorrect.</div>';}return;}
  if(k==='ask'){const v=visitor();const p=S.players.find(x=>x.id===f.dataset.id);S.requests.push({id:'R-'+Date.now(),at:new Date().toISOString(),pid:p.id,vid:v?v.id:null,from:v?v.name:fd.name,email:v?v.email:fd.email,message:fd.message,access:access(p),status:'nouvelle'});save();
    openModal(`<div style="display:flex;flex-direction:column;gap:14px"><h2 class="h3">${S.lang==='fr'?'Merci':'Thank you'}</h2><p style="margin:0">${t('reqDone')}</p><button class="btn btn-p" data-act="close">OK</button></div>`);return;}
  if(k==='contact'){S.requests.push({id:'R-'+Date.now(),at:new Date().toISOString(),pid:null,vid:null,from:fd.name,email:fd.email,message:fd.message,status:'nouvelle'});save();f.outerHTML=`<div class="panel"><p style="margin:0">${t('reqDone')}</p></div>`;return;}
  if(k==='visitor'){if(S.visitors.some(v=>v.login===fd.login.trim())){toast('Cet identifiant existe déjà');return;}
    const v={id:'V-'+Date.now(),name:fd.name.trim(),email:fd.email.trim(),login:fd.login.trim(),pass:genPass(),lang:fd.lang,expires:fd.expires,lastVisit:null,created:new Date().toISOString(),access:{}};
    S.players.forEach(p=>v.access[p.id]=fd.init);S.visitors.push(v);save();rerender();shareModal(v.id,true);return;}
});
route();
</script>
